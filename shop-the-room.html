<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop the Room | Chester’s India</title>
<style>
/* Verified on chestersindia.com: Lusitana 400; section H2 24px;
   editorial body 16–18px; Proxima Nova product names 14px.
   The existing Chester's Shopify theme already loads both fonts.
   These faces also support opening this standalone preview. */
@font-face{font-family:ChestersRoomSerif;src:url('https://chestersindia.com/cdn/shop/t/9/assets/Lusitana-Regular.woff2?v=107884916681843808601750971565') format('woff2');font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:ChestersRoomSans;src:url('https://use.typekit.net/af/d7ff92/00000000000000007735e609/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3') format('woff2');font-style:normal;font-weight:400;font-display:swap}
/* All section rules are scoped. No theme-wide heading/button/image overrides. */
.chestersindia-room-section{--room-bg:#f9f8f6;--room-text:#292823;--room-muted:#68645e;--room-line:#dedad3;--room-serif:Lusitana,ChestersRoomSerif,Georgia,serif;--room-sans:proxima-nova,ChestersRoomSans,Arial,sans-serif;display:block;width:100%;padding:72px 0;background:var(--room-bg);color:var(--room-text);font:400 16px/1.5 var(--room-serif);isolation:isolate}
.chestersindia-room-section *{box-sizing:border-box}
.chestersindia-room-section [hidden]{display:none!important}
.chestersindia-room-section .cr-wrap{width:calc(100% - 80px);max-width:1600px;margin-inline:auto}
.chestersindia-room-section .cr-header{margin:0 0 32px}
.chestersindia-room-section .cr-label{margin:0 0 12px;font:400 12px/1.4 var(--room-sans);letter-spacing:.18em}
.chestersindia-room-section .cr-title{margin:0 0 12px;font:400 24px/1.25 var(--room-serif);letter-spacing:.025em;color:var(--room-text)}
.chestersindia-room-section .cr-intro{margin:0;color:var(--room-muted);font:400 18px/1.5 var(--room-serif)}
.chestersindia-room-section .cr-layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:36px;align-items:start}
.chestersindia-room-section .cr-visual{min-width:0;position:relative}
.chestersindia-room-section .cr-photo{position:relative;aspect-ratio:4/3;background:#e6dfd4;overflow:hidden}
.chestersindia-room-section .cr-room-image{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.chestersindia-room-section .cr-hotspot{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;place-items:center;width:44px;height:44px;padding:0;margin:0;border:0;border-radius:50%;background:transparent;color:#292823;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.chestersindia-room-section .cr-hotspot::before{content:'';position:absolute;inset:7px;border:1px solid #fff;border-radius:50%;background:rgba(249,248,246,.91);box-shadow:0 1px 7px #0003;transition:background .15s}
.chestersindia-room-section .cr-hotspot span{position:relative;font:400 21px/1 Arial,sans-serif}
.chestersindia-room-section .cr-hotspot:hover::before,.chestersindia-room-section .cr-hotspot[aria-expanded=true]::before{background:#292823}
.chestersindia-room-section .cr-hotspot:hover,.chestersindia-room-section .cr-hotspot[aria-expanded=true]{color:#fff}
.chestersindia-room-section :is(button,a):focus-visible{outline:2px solid #44382c;outline-offset:4px}
.chestersindia-room-section .cr-hotspot:focus-visible{outline-color:#fff;box-shadow:0 0 0 4px #292823}
.chestersindia-room-section .cr-card{position:absolute;z-index:4;width:246px;max-width:calc(100% - 24px);padding:23px 38px 22px 22px;background:#f9f8f6;box-shadow:0 5px 24px #211b1717}
.chestersindia-room-section .cr-card h3{margin:0 0 5px;color:var(--room-text);font:400 18px/1.3 var(--room-serif)}
.chestersindia-room-section .cr-card p{margin:0 0 12px;color:var(--room-muted);font:400 14px/1.45 var(--room-sans)}
.chestersindia-room-section .cr-close{position:absolute;right:0;top:0;width:36px;height:36px;border:0;background:none;color:var(--room-text);font:400 23px/1 Arial,sans-serif;cursor:pointer}
.chestersindia-room-section .cr-link{display:inline-block;padding-block:6px;color:var(--room-text);font:400 14px/1.4 var(--room-sans);text-decoration:underline;text-decoration-color:#aaa296;text-underline-offset:5px;text-decoration-thickness:1px}
.chestersindia-room-section .cr-link:hover{text-decoration-color:currentColor}
.chestersindia-room-section .cr-hint{margin:12px 0 0;color:var(--room-muted);font:400 12px/1.5 var(--room-sans)}
.chestersindia-room-section .cr-panel{border-top:1px solid var(--room-line);min-width:0}
.chestersindia-room-section .cr-panel-title{margin:23px 0 15px;font:400 14px/1.4 var(--room-sans);letter-spacing:.14em}
.chestersindia-room-section .cr-products{list-style:none;margin:0;padding:0}
.chestersindia-room-section .cr-product{display:grid;grid-template-columns:104px minmax(0,1fr);gap:18px;align-items:center;margin:0;padding:20px 0;border-bottom:1px solid var(--room-line)}
.chestersindia-room-section .cr-product.is-active .cr-product-name{text-decoration:underline;text-underline-offset:5px;text-decoration-color:#aaa296}
/* Thumbnails are crops of the actual furniture in the supplied website photo.
   Replace thumbnailUrl/crop settings with verified product cutouts when available. */
.chestersindia-room-section .cr-thumb{position:relative;display:block;width:104px;aspect-ratio:1.15;overflow:hidden;background:#eae5dd}
.chestersindia-room-section .cr-thumb img{position:absolute;display:block;width:var(--zoom);max-width:none;height:auto;left:var(--left);top:var(--top)}
.chestersindia-room-section .cr-product-name{margin:0 0 5px;color:var(--room-text);font:400 14px/1.4 var(--room-sans)}
.chestersindia-room-section .cr-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(min-width:1800px){.chestersindia-room-section .cr-layout{gap:48px}}
@media(max-width:1100px){.chestersindia-room-section .cr-wrap{width:calc(100% - 48px)}.chestersindia-room-section .cr-layout{grid-template-columns:minmax(0,1fr) 250px;gap:24px}.chestersindia-room-section .cr-product{grid-template-columns:80px minmax(0,1fr);gap:12px;padding:16px 0}.chestersindia-room-section .cr-thumb{width:80px}}
@media(max-width:800px){.chestersindia-room-section{padding:44px 0}.chestersindia-room-section .cr-wrap{width:100%}.chestersindia-room-section .cr-header{padding-inline:24px;margin-bottom:24px}.chestersindia-room-section .cr-title{font-size:24px}.chestersindia-room-section .cr-intro{font-size:16px}.chestersindia-room-section .cr-layout{display:block}.chestersindia-room-section .cr-hint{margin-inline:24px}.chestersindia-room-section .cr-card{position:relative;inset:auto!important;width:auto;max-width:none;margin:16px 24px 0;padding:20px 42px 20px 20px;box-shadow:none;border:1px solid var(--room-line)}.chestersindia-room-section .cr-panel{margin:30px 24px 0}.chestersindia-room-section .cr-products{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}.chestersindia-room-section .cr-product{grid-template-columns:88px minmax(0,1fr)}.chestersindia-room-section .cr-thumb{width:88px}}
@media(max-width:520px){.chestersindia-room-section .cr-products{display:block}.chestersindia-room-section .cr-product{grid-template-columns:104px minmax(0,1fr);gap:22px;padding:18px 0}.chestersindia-room-section .cr-thumb{width:104px}.chestersindia-room-section .cr-header{padding-inline:20px}.chestersindia-room-section .cr-panel{margin-inline:20px}.chestersindia-room-section .cr-card{margin-inline:20px}}
@media(prefers-reduced-motion:reduce){.chestersindia-room-section *{transition:none!important}}
</style>
</head>
<body style="margin:0">
<!-- Copy this section, the scoped CSS, and the script into your page.
     For Shopify use a Custom Liquid block; this is not a schema-based section file. -->
<section class="chestersindia-room-section" data-chesters-room aria-label="Shop the room">
  <div class="cr-wrap">
    <header class="cr-header">
      <p class="cr-label">LIVING SPACES</p>
      <h2 class="cr-title">SHOP THE ROOM</h2>
      <p class="cr-intro">Discover the pieces that bring each space together.</p>
    </header>
    <div class="cr-layout">
      <div class="cr-visual">
        <div class="cr-photo">
          <img class="cr-room-image" src="https://chestersindia.com/cdn/shop/files/C61EB306-A69D-4B54-92B5-AAAA9C69F860.jpg?v=1755158598&width=1920" alt="Chester’s India showroom with a tufted leather sofa, leather chair, coffee table and side table." width="1280" height="1920" loading="lazy" decoding="async">
        </div>
        <div class="cr-card" role="region" aria-label="Selected furniture" hidden>
          <button class="cr-close" type="button" aria-label="Close product details">×</button>
          <h3></h3><p></p><a class="cr-link"></a>
        </div>
        <p class="cr-hint">Select a + to explore the furniture.</p>
        <span class="cr-sr" role="status" aria-live="polite"></span>
      </div>
      <aside class="cr-panel" aria-label="Furniture in this room">
        <h3 class="cr-panel-title">SHOP THIS ROOM</h3>
        <ul class="cr-products"></ul>
        <noscript><p><a class="cr-link" href="https://chestersindia.com/collections/all-sofas-and-couches">Explore sofas →</a></p><p><a class="cr-link" href="https://chestersindia.com/collections/all-armchairs-and-single-seaters">Explore armchairs →</a></p><p><a class="cr-link" href="https://chestersindia.com/pages/contact-us">Enquire about this room →</a></p></noscript>
      </aside>
    </div>
  </div>
</section>
<script>
(() => {
  'use strict';
  const roomImage = 'https://chestersindia.com/cdn/shop/files/C61EB306-A69D-4B54-92B5-AAAA9C69F860.jpg?v=1755158598&width=800';
  /* Exact models in this showroom photo are NOT verified.
     Supply a verified productUrl to automatically change the CTA to View Product.
     Until then these are honestly labelled collection/enquiry links.
     x/y correspond to the fixed 4:3 photo crop at object-position:50% 35%.
     If you replace the room photograph, update the hotspot positions too. */
  const products = [
    {name:'Leather Sofa',detail:'Explore Chester’s leather sofas.',x:77,y:20,productUrl:'',fallbackUrl:'https://chestersindia.com/collections/all-sofas-and-couches',fallbackLabel:'Explore Sofas →',zoom:'235%',left:'-112%',top:'-91%'},
    {name:'Lounge Chair',detail:'Explore the armchair collection.',x:67,y:77,productUrl:'',fallbackUrl:'https://chestersindia.com/collections/all-armchairs-and-single-seaters',fallbackLabel:'Explore Chairs →',zoom:'195%',left:'-85%',top:'-138%'},
    {name:'Coffee Table',detail:'Enquire about the table in this room.',x:63,y:38,productUrl:'',fallbackUrl:'https://chestersindia.com/pages/contact-us',fallbackLabel:'Enquire →',zoom:'240%',left:'-116%',top:'-110%'},
    {name:'Side Table',detail:'Enquire about the table in this room.',x:40,y:21,productUrl:'',fallbackUrl:'https://chestersindia.com/pages/contact-us',fallbackLabel:'Enquire →',zoom:'500%',left:'-151%',top:'-185%'}
  ];
  function init(scope=document) {
    scope.querySelectorAll('[data-chesters-room]:not([data-room-ready])').forEach(section => {
      section.dataset.roomReady = 'true';
      const photo=section.querySelector('.cr-photo'),card=section.querySelector('.cr-card'),list=section.querySelector('.cr-products');
      const status=section.querySelector('[role="status"]');
      const mobile=matchMedia('(max-width:800px)');
      const uid='cr-'+(crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
      card.id=uid; let active=-1;
      const buttons=[],rows=[];
      const url=p=>p.productUrl||p.fallbackUrl;
      const label=p=>p.productUrl?'View Product →':p.fallbackLabel;
      function place(){
        if(active<0||mobile.matches)return;
        const p=products[active],w=photo.clientWidth,h=photo.clientHeight;
        const cw=card.offsetWidth,ch=card.offsetHeight;
        const x=w*p.x/100,y=h*p.y/100;
        let left=x+24;if(left+cw>w-12)left=x-cw-24;
        let top=y-ch/2;
        card.style.left=Math.max(12,Math.min(left,w-cw-12))+'px';
        card.style.top=Math.max(12,Math.min(top,h-ch-12))+'px';
      }
      function close(restore=false){
        const old=active;active=-1;card.hidden=true;
        buttons.forEach(b=>b.setAttribute('aria-expanded','false'));
        rows.forEach(r=>r.classList.remove('is-active'));
        status.textContent='';if(restore&&old>=0)buttons[old].focus();
      }
      function open(index){
        active=index;const p=products[index];
        card.querySelector('h3').textContent=p.name;
        card.querySelector('p').textContent=p.detail;
        const a=card.querySelector('a');a.href=url(p);a.textContent=label(p);a.setAttribute('aria-label',label(p).replace(' →','')+': '+p.name);
        buttons.forEach((b,i)=>b.setAttribute('aria-expanded',String(i===index)));
        rows.forEach((r,i)=>r.classList.toggle('is-active',i===index));
        card.hidden=false;place();status.textContent=p.name+'. '+p.detail;
      }
      products.forEach((p,index)=>{
        const button=document.createElement('button');button.className='cr-hotspot';button.type='button';
        button.style.setProperty('--x',p.x+'%');button.style.setProperty('--y',p.y+'%');
        button.setAttribute('aria-label','Explore '+p.name);button.setAttribute('aria-controls',uid);button.setAttribute('aria-expanded','false');
        const plus=document.createElement('span');plus.textContent='+';plus.setAttribute('aria-hidden','true');button.append(plus);
        button.addEventListener('click',()=>open(index));
        button.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse'&&!card.contains(document.activeElement))open(index)});
        button.addEventListener('keydown',event=>{if(event.key==='ArrowDown'&&active===index){event.preventDefault();card.querySelector('a').focus()}});
        photo.append(button);buttons.push(button);
        const row=document.createElement('li');row.className='cr-product';
        const thumb=document.createElement('a');thumb.className='cr-thumb';thumb.href=url(p);thumb.tabIndex=-1;thumb.setAttribute('aria-hidden','true');
        thumb.style.setProperty('--zoom',p.zoom);thumb.style.setProperty('--left',p.left);thumb.style.setProperty('--top',p.top);
        const img=document.createElement('img');img.src=p.thumbnailUrl||roomImage;img.alt='';img.loading='lazy';img.decoding='async';
        if(p.thumbnailUrl){img.style.cssText='position:static;width:100%;height:100%;object-fit:contain'}
        thumb.append(img);
        const copy=document.createElement('div'),name=document.createElement('h4'),link=document.createElement('a');
        name.className='cr-product-name';name.textContent=p.name;link.className='cr-link';link.href=url(p);link.textContent=label(p);link.setAttribute('aria-label',label(p).replace(' →','')+': '+p.name);
        copy.append(name,link);row.append(thumb,copy);list.append(row);rows.push(row);
      });
      card.querySelector('.cr-close').addEventListener('click',()=>close(true));
      section.addEventListener('keydown',event=>{if(event.key==='Escape'&&active>=0){event.preventDefault();close(true)}});
      document.addEventListener('pointerdown',event=>{if(!section.contains(event.target))close()});
      new ResizeObserver(place).observe(photo);mobile.addEventListener('change',place);
    });
  }
  init();
  document.addEventListener('shopify:section:load',event=>init(event.target));
})();
</script>
</body>
</html>
