<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chester's Trust Bar</title>
<style>
  .trustbar-section,
  .trustbar-section * {
    box-sizing: border-box;
  }

  .trustbar-section {
    width: 100%;
    padding: var(--trustbar-padding-top) 20px var(--trustbar-padding-bottom);
    background: var(--trustbar-background);
    --trustbar-background: #F9F6F1;
    --trustbar-text: #5D4037;
    --trustbar-accent: #5D4037;
    --trustbar-hover: #4A0E0E;
    --trustbar-max-width: 1200px;
    --trustbar-icon-size: 72px;
    --trustbar-text-size: 16px;
    --trustbar-text-width: 220px;
    --trustbar-padding-top: 48px;
    --trustbar-padding-bottom: 48px;
    --trustbar-mobile-padding-top: 32px;
    --trustbar-mobile-padding-bottom: 32px;
  }

  .trustbar-main {
    width: 100%;
  }

  .trustbar-grid {
    width: 100%;
    max-width: var(--trustbar-max-width);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    gap: 32px 24px;
  }

  .trustbar-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    text-align: center;
  }

  .trustbar-icon-wrap {
    width: var(--trustbar-icon-size);
    height: var(--trustbar-icon-size);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--trustbar-accent);
    border-radius: 50%;
    color: var(--trustbar-accent);
    transition:
      transform 0.3s ease,
      border-color 0.3s ease,
      color 0.3s ease;
  }

  .trustbar-card:hover .trustbar-icon-wrap {
    color: var(--trustbar-hover);
    border-color: var(--trustbar-hover);
    transform: translateY(-3px);
  }

  .trustbar-icon {
    width: 34%;
    height: 34%;
    display: block;
  }

  .trustbar-copy,
  .trustbar-link {
    width: 100%;
    max-width: var(--trustbar-text-width);
    margin: 0;
    color: var(--trustbar-text);
    font-family: inherit;
    font-size: var(--trustbar-text-size);
    font-weight: 400;
    line-height: 1.5;
  }

  .trustbar-link {
    display: inline-block;
    padding-bottom: 3px;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    transition:
      color 0.3s ease,
      border-color 0.3s ease;
  }

  .trustbar-link:hover {
    color: var(--trustbar-hover);
  }

  .trustbar-link:focus-visible {
    color: var(--trustbar-hover);
    outline: 2px solid var(--trustbar-hover);
    outline-offset: 5px;
  }

  @media screen and (min-width: 768px) {
    .trustbar-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 48px 32px;
    }
  }

  @media screen and (min-width: 1024px) {
    .trustbar-section {
      padding-left: 60px;
      padding-right: 60px;
    }

    .trustbar-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 48px;
    }
  }

  @media screen and (max-width: 767px) {
    .trustbar-section {
      padding-top: var(--trustbar-mobile-padding-top);
      padding-bottom: var(--trustbar-mobile-padding-bottom);
    }

    .trustbar-card {
      gap: 14px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .trustbar-icon-wrap,
    .trustbar-link {
      transition: none;
    }

    .trustbar-card:hover .trustbar-icon-wrap {
      transform: none;
    }
  }
</style>
</head>
<body>

<section class="trustbar-section" aria-label="Chester's India trust highlights">
  <div class="trustbar-main">
    <div class="trustbar-grid">

      <!-- Trust item 1: Craftsmanship -->
      <div class="trustbar-card">
        <div class="trustbar-icon-wrap">
          <svg class="trustbar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 4.5L19.5 9.5M13 6L18 11M11.5 7.5L4 15C3.45 15.55 3.45 16.45 4 17L7 20C7.55 20.55 8.45 20.55 9 20L16.5 12.5M12 3L21 12"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="trustbar-copy">Handcrafted in Bangalore since 1986.</p>
      </div>

      <!-- Trust item 2: Leather -->
      <div class="trustbar-card">
        <div class="trustbar-icon-wrap">
          <svg class="trustbar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3C8 3 5 6 5 10C5 14.5 8 18.5 12 21C16 18.5 19 14.5 19 10C19 6 16 3 12 3ZM8 9C10 10 14 10 16 9M9 14C11 15 13 15 15 14"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="trustbar-copy">European hides, finished in-house.</p>
      </div>

      <!-- Trust item 3: Delivery -->
      <div class="trustbar-card">
        <div class="trustbar-icon-wrap">
          <svg class="trustbar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 6H14V17H3V6ZM14 10H18L21 13V17H14V10ZM7 20C8.1 20 9 19.1 9 18C9 16.9 8.1 16 7 16C5.9 16 5 16.9 5 18C5 19.1 5.9 20 7 20ZM18 20C19.1 20 20 19.1 20 18C20 16.9 19.1 16 18 16C16.9 16 16 16.9 16 18C16 19.1 16.9 20 18 20Z"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="trustbar-copy">Pan-India delivery and installation.</p>
      </div>

      <!-- Trust item 4: Consultation (with link) -->
      <div class="trustbar-card">
        <div class="trustbar-icon-wrap">
          <svg class="trustbar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 3V6M18 3V6M4 9H20M5 5H19C20.1 5 21 5.9 21 7V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V7C3 5.9 3.9 5 5 5ZM8 15L11 18L17 12"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <a class="trustbar-link" href="#">Book a design consultation.</a>
      </div>

    </div>
  </div>
</section>

</body>
</html>
