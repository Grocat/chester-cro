<body class="bg-warm-cream text-charcoal font-body-lg antialiased">
<!-- TopAppBar from JSON -->

<!-- Main Content Area - Showroom Booking -->
<main class="w-full max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop py-section-gap">
<section class="grid grid-cols-1 lg:grid-cols-12 gap-gutter lg:gap-16 items-center">
<!-- Left Side: Image Placeholder -->
<div class="lg:col-span-7 h-[512px] lg:h-[800px] w-full relative group overflow-hidden border border-muted-brown/20">
<img alt="Showroom Interior" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A luxurious, high-end furniture showroom interior. The space features meticulously crafted leather sofas and bespoke wooden tables arranged in a minimal, modern architectural setting. Soft, diffuse natural light pours in through large, grid-paned windows, highlighting the rich textures of warm brown leather and the deep tones of dark burgundy and muted brown accents. The overall mood is sophisticated, serene, and tactile, embodying a modern luxury aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBRSPa4ZoTkNF_6SOxe-B2sMWw8ThYVh_RTh9oRkF1p6sgEQrKCJ9jOQIm0VUDUcjMGb5z9rVtjaVqLrTaXgR24MR-iAlef_RPKbXoHvyJeXknsWx1dPDlfVgaMsEA0YMOUQoFIQu6gZCOQnts-fFSth9W5qUhZbnkBX5TNc0MLBC2_RBklmsD2_g6RurvsO6wGDVHjVZADTiv_vz7M3c1YW6dCV2ARjDJ7VqFxRH8gjGQnUZmZpLLm">
<!-- Subtle overlay for depth -->
<div class="absolute inset-0 bg-warm-cream/5"></div>
</div>
<!-- Right Side: Booking Form -->
<div class="lg:col-span-5 flex flex-col justify-center">
<div class="max-w-md mx-auto lg:mx-0 w-full pl-0 lg:pl-8">
<!-- Heading Area -->
<div class="mb-12">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-dark-burgundy mb-6">
                            Visit Our Infantry Road Showroom
                        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                            See and feel the leather in person before you decide. Experience the craftsmanship firsthand in our curated space.
                        </p>
</div>
<!-- Form Area -->
<form action="#" class="space-y-8" method="POST">
<!-- Name Field -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-muted-brown uppercase tracking-widest mb-2" for="name">Full Name</label>
<input class="w-full bg-transparent border-0 border-b border-muted-brown/50 focus:border-dark-burgundy focus:ring-0 px-0 py-3 font-body-lg text-body-lg text-charcoal placeholder-muted-brown/30 transition-colors duration-300" id="name" name="name" placeholder="e.g. Jane Doe" required="" type="text">
</div>
<!-- Phone Field -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-muted-brown uppercase tracking-widest mb-2" for="phone">Phone Number</label>
<input class="w-full bg-transparent border-0 border-b border-muted-brown/50 focus:border-dark-burgundy focus:ring-0 px-0 py-3 font-body-lg text-body-lg text-charcoal placeholder-muted-brown/30 transition-colors duration-300" id="phone" name="phone" placeholder="+91 XXXXX XXXXX" required="" type="tel">
</div>
<!-- Date/Time Field (Combined for simplicity in minimal design) -->
<div class="grid grid-cols-2 gap-6">
<div class="relative">
<label class="block font-label-caps text-label-caps text-muted-brown uppercase tracking-widest mb-2" for="date">Preferred Date</label>
<input class="w-full bg-transparent border-0 border-b border-muted-brown/50 focus:border-dark-burgundy focus:ring-0 px-0 py-3 font-body-lg text-body-lg text-charcoal transition-colors duration-300" id="date" name="date" required="" type="date">
</div>
<div class="relative">
<label class="block font-label-caps text-label-caps text-muted-brown uppercase tracking-widest mb-2" for="time">Time</label>
<select class="w-full bg-transparent border-0 border-b border-muted-brown/50 focus:border-dark-burgundy focus:ring-0 px-0 py-3 font-body-lg text-body-lg text-charcoal transition-colors duration-300 appearance-none rounded-none" id="time" name="time" required="">
<option disabled="" selected="" value="">Select Time</option>
<option value="morning">Morning (10 AM - 1 PM)</option>
<option value="afternoon">Afternoon (1 PM - 4 PM)</option>
<option value="evening">Evening (4 PM - 7 PM)</option>
</select>
</div>
</div>
<!-- Actions -->
<div class="pt-8 space-y-4">
<button class="w-full bg-dark-burgundy text-warm-cream border border-dark-burgundy font-label-caps text-label-caps uppercase tracking-widest py-4 px-8 hover:bg-transparent hover:text-dark-burgundy transition-all duration-300 flex items-center justify-center gap-3 group" type="submit">
                                REQUEST VISIT
                                <span class="material-symbols-outlined text-[16px] transition-transform duration-300 group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
<a class="w-full border border-muted-brown/30 text-muted-brown font-label-caps text-label-caps uppercase tracking-widest py-4 px-8 hover:border-muted-brown hover:bg-muted-brown/5 transition-all duration-300 flex items-center justify-center gap-3" href="#">
                                CHAT ON WHATSAPP
                                <span class="material-symbols-outlined text-[16px]" data-icon="chat">chat</span>
</a>
</div>
<!-- Helper Text -->
<p class="font-body-sm text-body-sm text-muted-brown/60 text-center mt-6">
                            Both options stay live and connect you directly to our showroom team.
                        </p>
</form>
</div>
</div>
</section>
<!-- Decorative subtle hairline divider -->
<div class="w-full h-px bg-muted-brown/20 mt-section-gap"></div>
</main>
<!-- Footer from JSON -->

<script>
        // Simple scroll behavior for TopNav shadow (though spec says flat, a tiny transition helps usability on scroll)
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('top-nav');
            if (window.scrollY > 20) {
                nav.classList.add('shadow-sm');
                nav.classList.remove('py-6');
                nav.classList.add('py-4');
            } else {
                nav.classList.remove('shadow-sm');
                nav.classList.remove('py-4');
                nav.classList.add('py-6');
            }
        });
    </script>
